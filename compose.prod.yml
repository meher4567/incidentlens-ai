name: incidentlens

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  image: incidentlens-api:${APP_VERSION:-latest}
  restart: unless-stopped
  environment: &backend-environment
    APP_NAME: IncidentLens AI
    APP_VERSION: ${APP_VERSION:-latest}
    DATABASE_URL: postgresql://incidentlens:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/incidentlens
    REDIS_URL: redis://redis:6379/0
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
    API_KEY: ${API_KEY:?API_KEY is required}
    INGEST_RATE_LIMIT_PER_MINUTE: ${INGEST_RATE_LIMIT_PER_MINUTE:-120}
    RUN_STARTUP_MIGRATIONS: "false"
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  volumes:
    - models:/app/models
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 256
  stop_grace_period: 30s

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: incidentlens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: incidentlens
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidentlens"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  migrate:
    <<: *backend
    command: python -m alembic upgrade head
    environment:
      <<: *backend-environment
      RUN_STARTUP_MIGRATIONS: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
    expose:
      - "8000"

  worker_aggregate:
    <<: *backend
    command: celery -A worker.celery_app worker -Q aggregate -l info --concurrency=2
    healthcheck:
      test: ["CMD-SHELL", "celery -A worker.celery_app inspect ping --destination celery@$${HOSTNAME} --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  worker_detect:
    <<: *backend
    command: celery -A worker.celery_app worker -Q detect -l info --concurrency=2
    healthcheck:
      test: ["CMD-SHELL", "celery -A worker.celery_app inspect ping --destination celery@$${HOSTNAME} --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  celery_beat:
    <<: *backend
    command: celery -A worker.celery_app beat -l info --schedule /tmp/celerybeat-schedule
    healthcheck:
      disable: true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-false}
    image: incidentlens-frontend:${APP_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    pids_limit: 128

volumes:
  pgdata:
  redisdata:
  models:
