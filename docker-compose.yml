services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: incidentlens
      POSTGRES_PASSWORD: incidentlens
      POSTGRES_DB: incidentlens
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidentlens"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      APP_NAME: ${APP_NAME:-IncidentLens AI}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      DATABASE_URL: postgresql://incidentlens:incidentlens@db:5432/incidentlens
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  worker_aggregate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A worker.celery_app worker -Q aggregate -l info --concurrency=2
    environment:
      DATABASE_URL: postgresql://incidentlens:incidentlens@db:5432/incidentlens
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app

  worker_detect:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A worker.celery_app worker -Q detect -l info --concurrency=2
    environment:
      DATABASE_URL: postgresql://incidentlens:incidentlens@db:5432/incidentlens
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app

  celery_beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A worker.celery_app beat -l info --schedule /tmp/celerybeat-schedule
    environment:
      DATABASE_URL: postgresql://incidentlens:incidentlens@db:5432/incidentlens
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      VITE_DEMO_MODE: ${VITE_DEMO_MODE:-false}
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - /app/node_modules
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5173').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
